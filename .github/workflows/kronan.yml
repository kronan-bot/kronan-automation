name: Krónan Daily Report

on:
  schedule:
    - cron: '0,15,30,45 7,8,9 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap dashboard if missing
        run: |
          mkdir -p data
          if [ ! -f "data/Krónan_Dashboard.html" ]; then
            echo "Downloading base dashboard from Netlify..."
            curl -sL --max-time 60 -o "data/Krónan_Dashboard.html" "https://kronan-dashboard.netlify.app/"
            echo "Downloaded: $(wc -c < data/Krónan_Dashboard.html) bytes"
          else
            echo "Dashboard present: $(wc -c < data/Krónan_Dashboard.html) bytes"
          fi

      - name: Run cloud runner
        id: runner
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          NETLIFY_TOKEN:         ""
          NETLIFY_SITE_ID:       ""
        run: |
          mkdir -p data
          python scripts/cloud_runner.py 2>&1 | tee data/runner_output.txt
          PY_EXIT=${PIPESTATUS[0]}
          echo "---EXIT:$PY_EXIT---" >> data/runner_output.txt
          exit $PY_EXIT

      - name: Rebuild dashboard from master
        run: |
          MASTER="data/Krónan_Master_Skrá.xlsx"
          if [ -f "$MASTER" ]; then
            MSIZE=$(wc -c < "$MASTER")
            echo "Master size: $MSIZE bytes"
            if [ "$MSIZE" -gt 100000 ]; then
              echo "Regenerating dashboard from master..."
              KRONAN_BASE=data python scripts/update_dashboard_data.py && echo "Dashboard rebuilt OK" || echo "Dashboard rebuild failed"
            else
              echo "Master too small, skipping rebuild"
            fi
          fi

      - name: Deploy to Netlify
        if: steps.runner.outputs.processed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cp "data/Krónan_Dashboard.html" /tmp/index.html
          printf "/*\n  Content-Type: text/html; charset=utf-8\n  X-Content-Type-Options: nosniff\n" > /tmp/_headers
          cd /tmp && zip -j /tmp/deploy.zip index.html _headers && cd -
          echo "Zip: $(wc -c < /tmp/deploy.zip) bytes"
          RESULT=$(curl -sL \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          echo "Deploy: $(echo $RESULT | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state","?"), d.get("ssl_url",""))')"
          rm -f /tmp/deploy.zip /tmp/index.html /tmp/_headers

      - name: Commit results
        if: always()
        run: |
          git config user.name "Krónan Bot"
          git config user.email "kronan-bot@tokyo.is"
          git add data/
          git diff --staged --quiet || git commit -m "run: $(date -u '+%Y-%m-%d %H:%M UTC') processed=${{ steps.runner.outputs.processed }}"
          git push
