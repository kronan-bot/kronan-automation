name: Krónan Daily Report

on:
  schedule:
    - cron: '0,15,30,45 7,8,9 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap dashboard if missing
        run: |
          mkdir -p data
          if [ ! -f "data/Krónan_Dashboard.html" ]; then
            echo "Downloading base dashboard from Netlify..."
            curl -sL --max-time 60 -o "data/Krónan_Dashboard.html" "https://kronan-dashboard.netlify.app/"
            echo "Downloaded: $(wc -c < data/Krónan_Dashboard.html) bytes"
          else
            echo "Dashboard already present: $(wc -c < data/Krónan_Dashboard.html) bytes"
          fi

      - name: Run cloud runner (no Netlify)
        id: runner
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          NETLIFY_TOKEN:         ""
          NETLIFY_SITE_ID:       ""
        run: |
          mkdir -p data
          python scripts/cloud_runner.py 2>&1 | tee data/runner_output.txt
          PY_EXIT=${PIPESTATUS[0]}
          echo "---EXIT:$PY_EXIT---" >> data/runner_output.txt
          exit $PY_EXIT

      - name: Deploy to Netlify
        if: steps.runner.outputs.processed == 'true'
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          echo "Zipping dashboard..."
          cd data && zip -j deploy.zip "Krónan_Dashboard.html" && cd ..
          echo "Deploying to Netlify (site: $NETLIFY_SITE_ID)..."
          RESULT=$(curl -sL \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @data/deploy.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          echo "Deploy result: $(echo $RESULT | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"state\",\"\"), d.get(\"ssl_url\",\"\"), d.get(\"error_message\",\"\"))')"
          rm -f data/deploy.zip

      - name: Commit results
        if: always()
        run: |
          git config user.name "Krónan Bot"
          git config user.email "kronan-bot@tokyo.is"
          git add data/
          git diff --staged --quiet || git commit -m "run: $(date -u '+%Y-%m-%d %H:%M UTC') processed=${{ steps.runner.outputs.processed }}"
          git push
