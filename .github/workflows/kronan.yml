name: Krónan Daily Report

on:
  # Run every 15 minutes from 07:00 to 10:00 UTC
  # Iceland is UTC year-round (no daylight saving time)
  schedule:
    - cron: '0,15,30,45 7,8,9 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data files back to repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud runner
        id: runner
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          NETLIFY_TOKEN:         ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID:       ${{ secrets.NETLIFY_SITE_ID }}
        run: python scripts/cloud_runner.py

      - name: Commit updated data files
        if: steps.runner.outputs.processed == 'true'
        run: |
          git config user.name "Krónan Bot"
          git config user.email "kronan-bot@tokyo.is"
          git add data/Krónan_Master_Skrá.xlsx data/Krónan_Dashboard.html
          git diff --staged --quiet || git commit -m "Auto: process report $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
